name: Build mod jar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E "error:|warning:|What went wrong|Caused by|FAILED" -A2 build.log | head -80 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Elevator game tests
        continue-on-error: true
        run: |
          mkdir -p run-gametest
          echo "eula=true" > run-gametest/eula.txt
          set +e
          timeout 900 gradle runGameTestServer --no-daemon > gametest.log 2>&1
          code=$?
          set -e
          grep -nE "required tests|tests? (were )?(passed|failed)|Exception|Caused by|elevmodgametests|elevatorgametests|Test .*(failed|passed)|GameTestBatch|Running test" gametest.log | grep -v DEBUG | head -70 | while IFS= read -r line; do echo "::warning::GT ${line}"; done
          if [ "$code" = "0" ]; then echo "::notice::GAMETESTS_PASSED"; else
            echo "::error::GAMETESTS_FAILED exit=$code"
            # 실패 내용을 하나의 주석에 모아서 출력 (주석 개수 제한 회피)
            msg=$(grep -E "failed|Assert|GameTestAssert|elevatorgametests" gametest.log | grep -vE "UnixException|server.properties|DEBUG" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::GT_FAILURES%0A${msg}"
          fi

      - name: Dedicated server boot test
        continue-on-error: true
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > run/server.properties
          gradle runServer --no-daemon > server.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 150); do
            if grep -q "Done (" server.log; then ok=1; break; fi
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 4
          done
          pkill -f runServer || true
          pkill -f 'net.minecraftforge' || true
          sleep 3
          grep -iE "exception|error|elevmod" server.log | grep -viE "Downloading|DEBUG" | head -40 | while IFS= read -r line; do echo "::warning::${line}"; done
          if [ "$ok" = "1" ]; then echo "::notice::SERVER_BOOT_OK"; else echo "::error::SERVER_BOOT_FAILED"; tail -30 server.log | while IFS= read -r line; do echo "::error::${line}"; done; fi

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevmod-jar
          path: build/libs/*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Elevmod build ${{ github.run_number }}
          body: |
            Minecraft 1.20.1 / Forge 47.x 용 엘리베이터 모드 jar.
            커밋: ${{ github.sha }}
          files: build/libs/*.jar
          make_latest: true
