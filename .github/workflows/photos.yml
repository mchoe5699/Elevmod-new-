name: Screenshots

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'release label'
        required: false
        default: 'shots'

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
      - name: Prepare client options
        run: |
          mkdir -p run/config
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\nrenderDistance:6\nsimulationDistance:6\nguiScale:2\nnarrator:0\nsoundCategory_master:0.0\njoinedFirstServer:true\nskipMultiplayerWarning:true\ngraphicsMode:1\nentityShadows:false\nfov:0.0\n' > run/options.txt
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
      - name: Sample photos for the design studio test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p run/photo-samples
          gh release download reference-photos -p reference.zip -D /tmp/ref || true
          if [ -f /tmp/ref/reference.zip ]; then unzip -q -o /tmp/ref/reference.zip -d /tmp/ref/x; fi
          for f in elevator_car_operating_panel_2.jpg center_opening_elevator_doors_3.jpg elevator_floor_indicator_5.jpg elevator_floor_indicator_3.jpg; do
            find /tmp/ref/x -name "$f" -exec cp {} run/photo-samples/ \; ; done
          ls -la run/photo-samples
      - name: Run client and take screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 2400 gradle runClient -PelevmodPhoto=true --no-daemon > client.log 2>&1
          echo "exit=$?"
          set -e
          grep -E "\[photo\]|Exception|Caused by|ERROR" client.log | grep -v "DEBUG" | head -60 | while IFS= read -r line; do echo "::warning::${line}"; done
          ls run/screenshots || true
          mkdir -p out && cp run/screenshots/*.png out/ 2>/dev/null || true
          cp client.log out/client.log
          cd out && zip -q ../screenshots.zip * && cd ..
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.label }}-${{ github.run_number }}
          name: Screenshots ${{ github.event.inputs.label }} ${{ github.run_number }}
          files: screenshots.zip
          prerelease: true
          make_latest: false
