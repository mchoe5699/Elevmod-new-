plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            if (project.hasProperty('elevmodPhoto')) {
                property 'elevmod.photo', 'true'
                args '--width', '1600', '--height', '900'
            }
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

// 사진 형식 추가 지원(WebP, PSD, TGA, ICO, CMYK JPEG 등) – jar 안에 함께 넣음(Jar-in-Jar)
jarJar.enable()

def tmVersion = '3.10.1'
def tmLibs = [
        ['com.twelvemonkeys.common', 'common-lang'], ['com.twelvemonkeys.common', 'common-io'], ['com.twelvemonkeys.common', 'common-image'],
        ['com.twelvemonkeys.imageio', 'imageio-core'], ['com.twelvemonkeys.imageio', 'imageio-metadata'],
        ['com.twelvemonkeys.imageio', 'imageio-webp'], ['com.twelvemonkeys.imageio', 'imageio-psd'], ['com.twelvemonkeys.imageio', 'imageio-tga'],
        ['com.twelvemonkeys.imageio', 'imageio-bmp'], ['com.twelvemonkeys.imageio', 'imageio-pnm'], ['com.twelvemonkeys.imageio', 'imageio-pcx'],
        ['com.twelvemonkeys.imageio', 'imageio-sgi'], ['com.twelvemonkeys.imageio', 'imageio-iff'], ['com.twelvemonkeys.imageio', 'imageio-pict'],
        ['com.twelvemonkeys.imageio', 'imageio-icns'], ['com.twelvemonkeys.imageio', 'imageio-hdr'], ['com.twelvemonkeys.imageio', 'imageio-jpeg'],
        ['com.twelvemonkeys.imageio', 'imageio-tiff']]

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    tmLibs.each { lib ->
        minecraftLibrary("${lib[0]}:${lib[1]}:${tmVersion}") { transitive = false }
        jarJar(group: lib[0], name: lib[1], version: "[${tmVersion},4.0)") {
            transitive = false
            jarJar.pin(it, tmVersion)
        }
    }
}

// 배포 jar = 라이브러리를 포함한 jarJar 결과물 (분류자 없음), 일반 jar 는 slim
tasks.named('jarJar').configure { archiveClassifier.set('') }
tasks.named('jar', Jar).configure { archiveClassifier.set('slim') }
reobf { jarJar { } }
tasks.named('jarJar').configure { finalizedBy 'reobfJarJar' }

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
